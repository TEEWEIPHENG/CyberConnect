services:

################################################################################
# Traefik
################################################################################

  traefik:

    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"

      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      - "--providers.file.directory=/etc/traefik/dynamic"

      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      - "--log.level=DEBUG"

      - "--accesslog=true"
      - "--accesslog.format=json"

    ports:
      - "8080:8080"

################################################################################
# PostgreSQL
################################################################################

  postgres:

    ports:
      - "5432:5432"

    environment:
      TZ: ${TZ}

################################################################################
# Redis
################################################################################

  redis:

    ports:
      - "6379:6379"

################################################################################
# OpenSearch
################################################################################

  opensearch:

    ports:
      - "9200:9200"
      - "9600:9600"

    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"

################################################################################
# OpenSearch Dashboards
################################################################################

  dashboards:

    ports:
      - "5601:5601"

################################################################################
# MinIO
################################################################################

  minio:

    ports:
      - "9000:9000"
      - "9001:9001"

