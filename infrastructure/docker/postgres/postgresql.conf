
# Minimal PostgreSQL configuration for Docker
# This file replaces the empty/missing config that caused the container to fail.

# Listen on all interfaces (adjust for production)
listen_addresses = '*'

# Port
port = 5432

# Memory and connections
max_connections = 100
shared_buffers = 128MB

# Logging
logging_collector = on
log_destination = 'stderr'
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 0

# Keep default data directory and other settings from the image
