name: Security Report
description: Report a security vulnerability
title: "[SECURITY] "
labels:
  - security

body:

  - type: markdown
    attributes:
      value: |
        Do not include secrets, credentials, or customer data.

        For critical vulnerabilities use the private security channel.


  - type: input
    id: affected
    attributes:
      label: Affected Component
      placeholder: "AuthService API"

    validations:
      required: true


  - type: textarea
    id: vulnerability
    attributes:
      label: Vulnerability Description

    validations:
      required: true


  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps


  - type: dropdown
    id: severity
    attributes:
      label: Severity

      options:
        - Critical
        - High
        - Medium
        - Low

    validations:
      required: true


  - type: textarea
    id: impact
    attributes:
      label: Security Impact