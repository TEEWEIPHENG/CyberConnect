name: Feature Request
description: Suggest a new capability
title: "[FEATURE] "
labels:
  - enhancement

body:

  - type: input
    id: feature
    attributes:
      label: Feature Name
      placeholder: "Customer Security Dashboard"

    validations:
      required: true


  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?

    validations:
      required: true


  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution


  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered


  - type: dropdown
    id: priority
    attributes:
      label: Priority

      options:
        - P0 Critical
        - P1 High
        - P2 Medium
        - P3 Low