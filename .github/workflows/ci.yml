name: CyberConnect CI


on:

  pull_request:

  push:
    branches:
      - main
      - develop


permissions:

  contents: read
  pull-requests: read
  security-events: write



jobs:


##################################
# Detect Changes
##################################

  changes:

    name: Detect Changes

    runs-on: ubuntu-latest

    outputs:

      frontend:
        ${{ steps.filter.outputs.frontend }}

      authservice:
        ${{ steps.filter.outputs.authservice }}


    steps:

      - uses: actions/checkout@v4


      - uses: dorny/paths-filter@v3

        id: filter

        with:

          filters: |

            frontend:
              - 'apps/cyber-app/**'

            authservice:
              - 'services/AuthService/**'



##################################
# Frontend CI
##################################

  frontend:


    needs: changes

    if: needs.changes.outputs.frontend == 'true'


    runs-on: ubuntu-latest


    defaults:

      run:

        working-directory: apps/cyber-app



    steps:


      - uses: actions/checkout@v4



      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: 22

          cache: npm

          cache-dependency-path: apps/cyber-app/package-lock.json



      - name: Install

        run:

          npm ci



      - name: Lint

        run:

          npm run lint



      - name: Test

        run:

          npm test



      - name: Build

        run:

          npm run build




##################################
# Auth Service CI
##################################


  authservice:


    needs: changes

    if: needs.changes.outputs.authservice == 'true'


    runs-on: ubuntu-latest


    defaults:

      run:

        working-directory: services/AuthService



    steps:


      - uses: actions/checkout@v4



      - name: Setup .NET

        uses: actions/setup-dotnet@v4

        with:

          dotnet-version: 8.x



      - name: Restore

        run:

          dotnet restore

      - name: Vulnerability Scan

        run:
          
          dotnet list package --vulnerable --include-transitive

      - name: Build

        run:

          dotnet build --no-restore



      - name: Test

        run:

          dotnet test --no-build



##################################
# Security Scan
##################################

  security:

    name: Security Scan

    runs-on: ubuntu-latest


    permissions:

      contents: read

      pull-requests: read

      security-events: write


    steps:


      - name: Checkout

        uses: actions/checkout@v5

        with:

          fetch-depth: 0



      ################################
      # Secret Detection
      ################################

      - name: Gitleaks

        uses: gitleaks/gitleaks-action@v2

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



      ################################
      # Dependency Vulnerability
      ################################

      - name: Dependency Audit

        run: |

          dotnet list package --vulnerable --include-transitive



      ##################################
      # Setup .NET
      ##################################

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.10
      ################################
      # CodeQL
      ################################

      - name: Initialize CodeQL

        uses: github/codeql-action/init@v3

        with:

          languages: csharp,javascript

      ##################################
      # Build for CodeQL
      ##################################
      - name: Build .NET
        run: |

          dotnet restore CyberConnect.sln

          dotnet build CyberConnect.sln \
            --configuration Release \
            --no-restore

      ##################################
      # CodeQL Analyze
      ##################################

      - name: CodeQL Analysis

        uses: github/codeql-action/analyze@v3