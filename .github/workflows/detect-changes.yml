name: Detect Changes

on:
  workflow_call:
    outputs:
      frontend:
        description: "Cyber App changed"
        value: ${{ jobs.detect.outputs.frontend }}

      authservice:
        description: "AuthService changed"
        value: ${{ jobs.detect.outputs.authservice }}

jobs:
  detect:
    name: Detect Changed Projects

    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      authservice: ${{ steps.detect.outputs.authservice }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: detect
        shell: bash
        run: |
          # Determine the base commit
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: ${{ github.sha }}"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")

          echo "Changed files:"
          echo "$CHANGED_FILES"

          FRONTEND=false
          AUTHSERVICE=false

          while IFS= read -r file; do
            [[ "$file" == apps/cyber-app/* ]] && FRONTEND=true
            [[ "$file" == services/AuthService/* ]] && AUTHSERVICE=true
          done <<< "$CHANGED_FILES"

          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "authservice=$AUTHSERVICE" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "Frontend changed: ${{ steps.detect.outputs.frontend }}"
          echo "AuthService changed: ${{ steps.detect.outputs.authservice }}"