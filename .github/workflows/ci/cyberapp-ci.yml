name: Cyber App CI

on:
  pull_request:
    paths:
      - "apps/cyber-app/**"

  push:
    branches:
      - main
    paths:
      - "apps/cyber-app/**"

permissions:
  contents: read

env:
  NODE_VERSION: "24.x"
  APP_PATH: apps/cyber-app

jobs:
  build:
    name: Build Cyber App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.APP_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/cyber-app/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run lint
        run: |
          npm run lint

      - name: Run tests
        run: |
          npm test -- --coverage

      - name: Build production
        run: |
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-app-build
          path: apps/cyber-app/dist
