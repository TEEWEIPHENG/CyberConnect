name: Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Cleanup old runs and artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 5

      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner,
              repo,
              per_page: 100,
            });

            const cutoff = Date.now() - 1000 * 60 * 60 * 24 * 7;
            const stale = artifacts.data.artifacts.filter((artifact) => {
              return new Date(artifact.created_at).getTime() < cutoff;
            });

            for (const artifact of stale) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted artifact: ${artifact.name} (${artifact.id})`);
            }
