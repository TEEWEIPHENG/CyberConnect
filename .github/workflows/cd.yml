name: CD

on:
  workflow_run:
    workflows:
      - Security Scan
    types:
      - completed
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ vars.IMAGE_OWNER }}/cyber-app
  AUTH_SERVICE_IMAGE: ghcr.io/${{ vars.IMAGE_OWNER }}/auth-service

jobs:
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      cyberapp: ${{ steps.filter.outputs.cyberapp }}
      authservice: ${{ steps.filter.outputs.authservice }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cyberapp:
              - 'apps/cyber-app/**'
              - '.github/workflows/cd.yml'
            authservice:
              - 'services/AuthService/**'
              - '.github/workflows/cd.yml'

  publish-images:
    name: Publish container images
    needs: changes
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push CyberApp image
        if: needs.changes.outputs.cyberapp == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: apps/cyber-app
          file: apps/cyber-app/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Scan CyberApp image
        if: needs.changes.outputs.cyberapp == 'true' || github.event_name == 'workflow_dispatch'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Build and push Auth service image
        if: needs.changes.outputs.authservice == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: services/AuthService
          file: services/AuthService/AuthService.API/Dockerfile
          push: true
          tags: |
            ${{ env.AUTH_SERVICE_IMAGE }}:latest
            ${{ env.AUTH_SERVICE_IMAGE }}:${{ github.sha }}

      - name: Scan Auth service image
        if: needs.changes.outputs.authservice == 'true' || github.event_name == 'workflow_dispatch'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.AUTH_SERVICE_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
