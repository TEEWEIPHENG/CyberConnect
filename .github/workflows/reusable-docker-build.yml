name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      image-name:
        description: Docker image name without registry (for example my-app)
        required: true
        type: string
      context:
        description: Build context path
        required: false
        type: string
        default: .
      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: ./Dockerfile
      target:
        description: Build target stage
        required: false
        type: string
        default: ""
      platforms:
        description: Target platforms for multi-platform builds
        required: false
        type: string
        default: linux/amd64
      push:
        description: Push the image to the registry
        required: false
        type: boolean
        default: false
      registry:
        description: Container registry host
        required: false
        type: string
        default: ghcr.io
      tags:
        description: Additional tags to apply to the image (comma separated)
        required: false
        type: string
        default: latest
      build-args:
        description: Build args passed to docker build (JSON string)
        required: false
        type: string
        default: "{}"
      cache-from:
        description: Cache source for the build
        required: false
        type: string
        default: ""
      cache-to:
        description: Cache destination for the build
        required: false
        type: string
        default: ""
    secrets:
      registry-username:
        description: Username for container registry login
        required: false
      registry-password:
        description: Password/token for container registry login
        required: false
    outputs:
      image:
        description: Fully qualified image name
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Image digest produced by the build
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          image_name="${{ inputs.registry }}/${{ inputs.image-name }}"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.tags }}
            type=sha

      - name: Log in to container registry
        if: ${{ inputs.push == true }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}

      - name: Build and optionally push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: ${{ inputs.cache-from }}
          cache-to: ${{ inputs.cache-to }}
          provenance: false
