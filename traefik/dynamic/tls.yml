http:
  middlewares:
    redirect-https:
      redirectScheme:
        scheme: https
        permanent: true
    
    proxy-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https
          X-Forwarded-Port: "443"

tls:
  certificates:
    - certFile: /certificates/cyberconnect.local.pem
      keyFile: /certificates/cyberconnect.local-key.pem
