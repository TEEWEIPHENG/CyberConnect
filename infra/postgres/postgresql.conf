# Minimal PostgreSQL configuration for Docker
# This file replaces the empty/missing config that caused the container to fail.

# PostgreSQL Configuration File

# Connection settings
listen_addresses = '*'
port = 5432
max_connections = 100

# Memory settings
shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 64MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 4MB

# Logging
log_min_duration_statement = -1
log_statement = 'all'
log_duration = off
